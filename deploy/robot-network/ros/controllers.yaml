/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 97
      overruns:
        manage: false
        print_warnings: false
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
      arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController
  franka_robot_state_broadcaster:
    ros__parameters:
      robot_type: fr3v2_1
      arm_prefix: ''
      convenience_publish_rate: 100
  arm_controller:
    ros__parameters:
      joints:
      - fr3v2_1_joint1
      - fr3v2_1_joint2
      - fr3v2_1_joint3
      - fr3v2_1_joint4
      - fr3v2_1_joint5
      - fr3v2_1_joint6
      - fr3v2_1_joint7
      command_interfaces:
      - effort
      state_interfaces:
      - position
      - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      interpolate_from_desired_state: false
      set_last_command_interface_value_as_state_on_activation: false
      constraints:
        stopped_velocity_tolerance: 0.01
        goal_time: 2.0
        fr3v2_1_joint1:
          trajectory: 0.03
          goal: 0.003
        fr3v2_1_joint2:
          trajectory: 0.03
          goal: 0.003
        fr3v2_1_joint3:
          trajectory: 0.03
          goal: 0.003
        fr3v2_1_joint4:
          trajectory: 0.03
          goal: 0.003
        fr3v2_1_joint5:
          trajectory: 0.03
          goal: 0.003
        fr3v2_1_joint6:
          trajectory: 0.03
          goal: 0.003
        fr3v2_1_joint7:
          trajectory: 0.03
          goal: 0.003
      gains:
        fr3v2_1_joint1:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        fr3v2_1_joint2:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        fr3v2_1_joint3:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        fr3v2_1_joint4:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        fr3v2_1_joint5:
